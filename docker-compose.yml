services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: litbot
      POSTGRES_PASSWORD: litbot
      POSTGRES_DB: litbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litbot -d litbot"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
